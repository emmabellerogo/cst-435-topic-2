# Controlled comparison 2/3: activation only.
# Identical to baseline.yaml except activation (relu -> gelu).
#   python -m api.run_experiments api/configs/baseline.yaml api/configs/gelu.yaml api/configs/deep.yaml
# Artifacts are written to models/<name>/.
name: gelu
architecture: mlp
hidden_sizes: [64, 32]        # same as baseline
activation: gelu              # <- the only difference from baseline
dropout: 0.1                  # same as baseline
learning_rate: 0.001          # controlled
weight_decay: 0.0001          # controlled
epochs: 30                    # controlled maximum budget
batch_size: 256               # controlled
seed: 42                      # controlled
early_stopping_patience: 5    # controlled
